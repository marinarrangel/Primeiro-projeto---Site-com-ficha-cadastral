<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de participação</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <div class="container">
     <nav>
        <ul>
            <li>
              <a href="index.html">Sobre nós</a>
            </li>
            <li>
              <a href="projeto.html">Projetos</a>
            </li> 
            <li>
              <a href="cadastro.html">Cadastro</a>
            </li>
         </ul>
    </nav>
    <header>
      <div class="center">
        <img src="./img/LoremIpsumONG.png" alt="Imagem da logotipo da ONG. Um cachorro feliz com o nome da ONG ao lado."></img>
      </div>
    </header>
    <div class="container">
        <div class="form">
            <form action="#">
                <div class="form-header">
                    <div class="title">
                        <h1>Cadastre-se</h1>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-box">
                        <label for="firstname">Nome</label>
                        <input id="firstname" type="text" name="firstname" placeholder="Digite seu primeiro nome" required>
                    </div>

                    <div class="input-box">
                        <label for="lastname">Sobrenome</label>
                        <input id="lastname" type="text" name="lastname" placeholder="Digite seu sobrenome" required>
                    </div>

                    <div class="input-box">
                        <label for="email">E-mail</label>
                        <input id="email" type="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="input-box">
                        <label for="number">Telefone</label>
                        <input id="number" type="tel" name="number" placeholder="(xx) xxxx-xxxx" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Crie sua senha" required>
                    </div>

                     <div class="input-box">
                        <label for="Confirmpassword">Confirme sua senha</label>
                        <input id="password" type="password" name="password" placeholder="Crie sua senha" required>
                    </div>
                    </div>
                    <div class="continue-button">
                        <button><a href="#">Continuar</a></button>
                    </div>
                </div>
            </form>
        </div>
</div>
    
</body>
</html>
